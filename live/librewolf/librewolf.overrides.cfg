// pref(): set at every start; the settings window can change a value until
// the next start.
// Keep cookies and site data when the browser closes:
// Outlook on the web, GitHub, school portals stay signed in.
pref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
pref("privacy.clearOnShutdown.cookies", false);
// Keep history (the address bar's suggestions) and form history.
pref("privacy.clearOnShutdown_v2.browsingHistoryAndDownloads", false);
pref("privacy.clearOnShutdown_v2.formdata", false);
// Fields suggest what was typed into them before (e-mail on a new site).
pref("browser.formfill.enable", true);
// No built-in password manager: KeePassXC-Browser fills and saves logins.
pref("signon.rememberSignons", false);
// resistFingerprinting forces a light theme and the UTC time zone, and makes
// some sites misbehave; Firefox's milder protection stays on instead.
pref("privacy.resistFingerprinting", false);
pref("privacy.fingerprintingProtection", true);
// WebGL: maps, GeoGebra 3D, some reveal.js decks.
pref("webgl.disabled", false);
