// GENERATED from config.org ("Internet / LibreWolf"). Do not edit; edit config.org.
// Keep cookies and logins when the browser closes (history is still cleared):
// Outlook on the web, GitHub, school portals stay signed in.
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
defaultPref("privacy.clearOnShutdown.cookies", false);
// resistFingerprinting forces a light theme and the UTC time zone, and makes
// some sites misbehave; Firefox's milder protection stays on instead.
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
// WebGL: maps, GeoGebra 3D, some reveal.js decks.
defaultPref("webgl.disabled", false);
// Firefox Sync is off by default in LibreWolf; uncomment to use it.
// defaultPref("identity.fxaccounts.enabled", true);
