#   spaces, each as NAME:WIDTHxHEIGHT:CIVS. Width and height in tiles, both
#   multiples of 4; CIVS is the default number of civilizations, 2 to 18.
#   Empty: only the game's own sizes.
bigger_maps="Giant:160x100:14 Gigantic:200x120:18"
